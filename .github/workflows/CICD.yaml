name: Build and Deploy Invoice Reminder App

on:
  push:
    branches: [ "main", "deployment-branch" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/invoice-reminder-app:latest
            ${{ secrets.DOCKER_USERNAME }}/invoice-reminder-app:${{ github.sha }}

      # ---------- Deploy to Ubuntu Server (only on deployment-branch) ----------
      - name: Deploy to Ubuntu Server (SSH)
        if: github.ref == 'refs/heads/deployment-branch'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/invoice-reminder-app:latest
            docker stop invoice-reminder || true
            docker rm invoice-reminder || true
            docker run -d --name invoice-reminder --restart always -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/invoice-reminder-app:latest
            docker image prune -f

      # ---------- Deploy to Azure Web App (only on main) ----------
      - name: Deploy to Azure Web App
        if: github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'invoice-reminder'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ secrets.DOCKER_USERNAME }}/invoice-reminder-app:${{ github.sha }}'
